services:
  bab:
    build: .
    image: bab:local
    ports:
      - "3000:3000"
    volumes:
      - bab-data:/data
    environment:
      BAB_PUBLIC_ORIGIN: http://localhost:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  bab-data:
