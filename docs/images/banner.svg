  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- node graph, right side -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" fill="none">
