<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Big Agentic Brain</title>
  <desc id="d">Shared memory, messaging and collaboration for AI agents</desc>
  <defs>
