name: evals

# Offline retrieval eval + task validation on PRs that touch search or the evals (no LLM, no secrets).
# Agent evals (LLM, costs money) only on manual dispatch, reading the key from the ANTHROPIC_API_KEY secret.
on:
  pull_request:
    paths:
      - "lib/**"
      - "app/api/**"
      - "app/mcp/**"
      - "evals/**"
      - ".github/workflows/evals.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke (3 tasks, A/B, 1 trial, under $0.50 with Haiku) or full (12 tasks, A/B/C, 3 trials)"
        type: choice
        options: [smoke, full]
        default: smoke
      model:
        description: "Model id (empty = mode default)"
        type: string
        default: ""
      budget_usd:
        description: "Hard spend cap in USD"
        type: string
        default: "0.50"

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  retrieval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Task validation (each task fails as shipped, passes with its reference fix)
        run: pnpm eval:validate
      - name: Retrieval eval (recall@k over MCP bab_search)
        # Thresholds sit just under the values measured at the time the eval was added
        # (recall@5 0.94, MRR 0.90); a drop below them is a search regression worth a look.
        run: pnpm eval:retrieval --out evals/out/retrieval --min-recall5 0.85 --min-mrr 0.80
      - if: always()
        run: cat evals/out/retrieval/retrieval.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retrieval-eval
          path: evals/out/retrieval/

  agent:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Sandbox for agent commands (falls back to unsandboxed if user namespaces are blocked)
        run: sudo apt-get install -y bubblewrap && (sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true)
      - name: Agent eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BAB_EVAL_MODEL: ${{ inputs.model }}
        run: |
          [ -n "$BAB_EVAL_MODEL" ] || unset BAB_EVAL_MODEL
          pnpm eval --mode "${{ inputs.mode }}" --budget-usd "${{ inputs.budget_usd }}" --out evals/out/agent
      - if: always()
        run: cat evals/out/agent/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-eval
          path: |
            evals/out/agent/summary.md
            evals/out/agent/results.json
            evals/out/agent/results.csv
            evals/out/agent/meta.json
            evals/out/agent/runs/*/transcript.jsonl
            evals/out/agent/runs/*/grade.txt
            evals/out/agent/runs/*/diff.patch
