name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: This issue is public. Leave out names, emails, internal hostnames or URLs, ticket keys, secrets and real logs. Use example.com placeholders. Report a leak or a vulnerability privately (SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that BAB makes hard?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you like to see? Alternatives you considered are welcome.
