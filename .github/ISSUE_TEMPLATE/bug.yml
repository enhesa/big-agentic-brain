name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: This issue is public. Leave out names, emails, internal hostnames or URLs, ticket keys, secrets and real logs. Use example.com placeholders. Report a leak or a vulnerability privately (SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options: [Open mode, Proxy identity, API tokens]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove secrets and personal data first.
      render: text
