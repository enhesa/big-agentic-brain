# Lets `pnpm install` run non-interactively (CI, Docker build) if a dependency ever brings a
# build script. The two approvals below are precautionary (lockfile v9 does not record
# requiresBuild): esbuild (only an optional peer of vite) and sharp (an optional dependency of
# next that BAB does not use) may run install scripts in some setups. The Dockerfile copies this
# file with the lockfile.
#
# Both keys are needed because pnpm changed how this is declared and silently ignores
# the key it does not recognize:
#   - `onlyBuiltDependencies`: pnpm 10.5 through 10.x. Removed in pnpm 11.
#   - `allowBuilds`: pnpm 11 and later.
# Adding a dependency with its own postinstall script? Add it to both lists.
onlyBuiltDependencies:
  - esbuild
  - sharp
allowBuilds:
  esbuild: true
  sharp: true
# source-map-js < 1.2.2 (GHSA-68fv-2mgg-jv7q) reaches us through next > postcss, dev-only; pinned until next moves on.
overrides:
  source-map-js: '>=1.2.2'
minimumReleaseAgeExclude:
  - '@next/env@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - next@16.4.1
